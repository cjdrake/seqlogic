[project]
name = "seqlogic"
version = "0.53.0"
description = "Sequential Logic"
readme = "README.md"

requires-python = ">=3.12"
dependencies = [
    "bvwx >= 0.22.0",
    "deltacycle >= 0.28.0",
    "pyvcd",
]

[project.urls]
Repository = "https://github.com/cjdrake/seqlogic.git"

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "pytest>=8.3.5",
    "pytest-cov>=6.1.1",
    "pytest-profiling>=1.8.1",
    "ruff>=0.11.9",
]
doc = [
    "sphinx>=9.1.0",
    "sphinx-autobuild>=2025.8.25",
    "sphinx-book-theme>=1.4.0",
]
